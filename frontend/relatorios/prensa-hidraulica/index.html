  <section>

    <p>Nos dados obtidos na questão 1, existe algum que está muito diferente dos demais? Em caso afirmativo, descarte este dado a partir deste ponto do relatório. <b>Discuta</b> qual a origem do dado diferente no experimento.</p>
    <textarea data-k="2) Dado discrepante"></textarea>

  <section>
    <h2>Questão 3</h2>
    <p><b>a) Aplique</b> a equação (K<sub>e</sub> = P/ΔX<sub>m</sub>) para obter os valores de K<sub>e</sub>.</p>
    <div data-t="ke"></div>
    <p><b>b) Utilize</b> as equações abaixo para obter os valores de K médio e desvio padrão.</p>
    <div class="eq" data-eq="e"></div>
    <div data-t="kest"></div>
    <p><b>c) Aplique</b> a equação (A<sub>b</sub> = πR²) para obter os valores da área da base das seringas.</p>
    <div data-t="area"></div>
    <p><b>d)</b> A partir da pressão indicada no manômetro e do valor médio da área da base das seringas, <b>aplique</b> a equação (F<sub>1</sub> = P<sub>1</sub> × A<sub>1</sub>) para obter as forças aplicadas na seringa 01.</p>
    <div data-t="f1"></div>
    <p><b>e)</b> Após encontrar o valor da força 1, <b>aplique</b> a equação (F<sub>2</sub> = (F<sub>1</sub> × A<sub>2</sub>) / A<sub>1</sub>) e obtenha as forças resultantes na seringa 02, em decorrência da aplicação do princípio de Pascal.</p>
    <div data-t="f2"></div>
    <p><b>f) Aplique</b> a equação (K<sub>2</sub> = F<sub>k2</sub>/ΔX<sub>m</sub>) para obter o deslocamento de cada mola instalada na seringa 02 (ΔX), os valores de K<sub>2</sub>.</p>
    <div class="note"><b>Atenção:</b> o valor da Força 2 encontrada na etapa anterior é referente às duas molas, logo devemos anotar o valor da força da mola sendo igual a F<sub>k2</sub> = F<sub>2</sub>/2. Desta forma torna-se possível identificar a força elástica de cada mola. Lembre que 1 kgf = 9,81 N.</div>
    <div data-t="k2"></div>
    <p><b>g) Manipule</b> a equação abaixo para obter o valor médio de K<sub>2</sub> e o desvio padrão correspondente.</p>
    <div class="eq" data-eq="2"></div>

    <p>A partir do comportamento da mola no experimento da prensa hidráulica: <b>avalie</b> se o valor da constante elástica da mola encontrado está de acordo com o valor de referência obtido por meio do experimento de Lei de Hooke.</p>

    <textarea data-k="6) Julgamento do método"></textarea>
  </section>

  <section>
    <h2>Questão 7</h2>
    <p>O valor obtido experimentalmente para a constante elástica da mola possui fontes de erro. <b>Proponha</b> um experimento autoral (novo) que lhe permita minimizar essas fontes de erro ou um novo procedimento que possa minimizar os erros do experimento.</p>
    <div class="note">Sejam criativos, discutam entre si. Essa questão é aberta e sem resposta correta. Utilizem os conhecimentos físicos que vocês têm. A ideia é estimular uma nova visão experimental e buscar e discutir novas ideias. Tentem propor um experimento em que sejam obtidos valores mais próximos do esperado.</div>
    <textarea data-k="7) Proposta de experimento autoral" style="min-height:220px"></textarea>
